name: Entra CBA Playwright POC

on:
  workflow_dispatch:
    inputs:
      verification_id:
        description: Unique verification identifier generated by the runner launcher
        required: true
        type: string
      runner_label:
        description: Unique runner label generated by the runner launcher
        required: true
        type: string

permissions: {}

run-name: Entra CBA POC ${{ inputs.verification_id || github.run_id }}

concurrency:
  cancel-in-progress: true
  group: entra-cba-playwright-poc-${{ github.ref }}

jobs:
  verify-cba:
    name: Verify Entra CBA
    environment: entra-cba-poc
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ inputs.runner_label || format('entra-cba-poc-run-{0}', github.run_id) }}
    timeout-minutes: 20
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      CBA_APP_URL: ${{ vars.CBA_APP_URL }}
      CBA_CERTAUTH_ORIGIN: ${{ vars.CBA_CERTAUTH_ORIGIN }}
      CBA_EXPECTED_OIDC_SUBJECT: ${{ vars.CBA_EXPECTED_OIDC_SUBJECT }}
      CBA_EXPECTED_PRIVATE_ENDPOINT_IP: ${{ vars.KEY_VAULT_PRIVATE_ENDPOINT_IP }}
      CBA_EXPECTED_RUNNER_SUBNET_CIDR: ${{ vars.RUNNER_SUBNET_CIDR }}
      CBA_PFX_PASSPHRASE_SECRET_NAME: ${{ vars.CBA_PFX_PASSPHRASE_SECRET_NAME }}
      CBA_PFX_SECRET_NAME: ${{ vars.CBA_PFX_SECRET_NAME }}
      CBA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      CBA_TEST_OBJECT_ID: ${{ vars.CBA_TEST_OBJECT_ID }}
      CBA_TEST_USERNAME: ${{ vars.CBA_TEST_USERNAME }}
      CBA_VERIFICATION_ID: ${{ inputs.verification_id || github.run_id }}
      CBA_RUNNER_LABEL: ${{ inputs.runner_label || format('entra-cba-poc-run-{0}', github.run_id) }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      RUN_NEGATIVE_CBA_TESTS: "false"

    steps:
      - name: Validate the dispatch identifier
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [[ ! "$CBA_VERIFICATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
                echo "::error::verification_id must be a lowercase version-4 UUID."
                exit 1
              fi
              expected_label="entra-cba-poc-${CBA_VERIFICATION_ID}"
              ;;
            push)
              if [[ "$CBA_VERIFICATION_ID" != "$GITHUB_RUN_ID" ]]; then
                echo "::error::Push verification ID must equal the workflow run ID."
                exit 1
              fi
              expected_label="entra-cba-poc-run-${GITHUB_RUN_ID}"
              ;;
            *)
              echo "::error::Unsupported workflow event."
              exit 1
              ;;
          esac
          if [[ "$CBA_RUNNER_LABEL" != "$expected_label" ]]; then
            echo "::error::runner_label does not match the verification-scoped runner."
            exit 1
          fi

      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify private Key Vault DNS
        shell: bash
        run: |
          set -euo pipefail
          vault_ip="$(getent ahostsv4 "${KEY_VAULT_NAME}.vault.azure.net" | awk 'NR == 1 { print $1 }')"
          if [[ "$vault_ip" != "$CBA_EXPECTED_PRIVATE_ENDPOINT_IP" ]]; then
            echo "::error::Key Vault did not resolve to the exact private endpoint IP."
            exit 1
          fi
          echo "Key Vault resolves to the exact private endpoint IP."

      - name: Exchange GitHub OIDC and retrieve CBA credentials
        working-directory: solutions/entra-cba-playwright
        run: node scripts/Get-CbaCredentialsFromKeyVault.mjs

      - name: Validate the retrieved PFX
        shell: bash
        run: |
          set -euo pipefail
          openssl pkcs12 \
            -in "$CBA_PFX_PATH" \
            -passin "file:$CBA_PFX_PASSPHRASE_PATH" \
            -noout

      - name: Install pinned Node dependencies
        working-directory: solutions/entra-cba-playwright
        run: npm ci --ignore-scripts

      - name: Type-check the POC
        working-directory: solutions/entra-cba-playwright
        run: npm run typecheck

      - name: Run the headless CBA feasibility test
        working-directory: solutions/entra-cba-playwright
        run: npx playwright test --project=cba-feasibility

      - name: Validate bounded test evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt_directory="solutions/entra-cba-playwright/.artifacts/receipts"
          expected_receipts=("cba-feasibility.json" "runner-network.json")
          mapfile -t actual_entries < <(
            find "$receipt_directory" -mindepth 1 -printf '%P\n' | LC_ALL=C sort
          )
          if [[ "${actual_entries[*]-}" != "${expected_receipts[*]}" ]]; then
            echo "Expected exactly the two sanitized evidence receipts." >&2
            exit 1
          fi
          for receipt in "${expected_receipts[@]}"; do
            receipt_path="${receipt_directory}/${receipt}"
            receipt_size="$(wc -c < "$receipt_path")"
            if (( receipt_size == 0 || receipt_size > 32768 )); then
              echo "Receipt '${receipt}' is empty or exceeds the 32 KiB artifact bound." >&2
              exit 1
            fi
            receipt_sha256="$(sha256sum "$receipt_path" | cut -d ' ' -f 1)"
            printf 'Validated bounded receipt %s (%s bytes, SHA-256 %s).\n' \
              "$receipt" "$receipt_size" "$receipt_sha256"
          done

      - name: Upload bounded test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: entra-cba-playwright-${{ github.run_id }}
          path: solutions/entra-cba-playwright/.artifacts/receipts
          retention-days: 7

      - name: Remove runtime credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          runtime_directory="${RUNNER_TEMP}/entra-cba"
          if [[ -d "$runtime_directory" ]]; then
            find "$runtime_directory" -type f -exec shred -u {} \;
            rmdir "$runtime_directory"
          fi
