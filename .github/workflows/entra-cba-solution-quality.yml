name: entra-cba-solution-quality

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/entra-cba-solution-quality.yml"
      - ".github/workflows/entra-cba-verification.yml"
      - ".github/workflows/entra-cba-playwright-poc.yml"
      - "solutions/entra-cba-playwright/**"
  pull_request:
    paths:
      - ".github/workflows/entra-cba-solution-quality.yml"
      - ".github/workflows/entra-cba-verification.yml"
      - ".github/workflows/entra-cba-playwright-poc.yml"
      - "solutions/entra-cba-playwright/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Entra CBA solution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solutions/entra-cba-playwright/package-lock.json

      - name: Install pinned dependencies
        working-directory: solutions/entra-cba-playwright
        run: npm ci --ignore-scripts

      - name: Type-check Playwright and application code
        working-directory: solutions/entra-cba-playwright
        run: npm run typecheck

      - name: Build the relying application
        working-directory: solutions/entra-cba-playwright
        run: npm run build:app

      - name: Test the memory-only CBA credential provider
        working-directory: solutions/entra-cba-playwright
        run: npm run test:credential-provider

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem solutions/entra-cba-playwright/scripts -Filter *.ps1 |
            ForEach-Object {
              $errors = $null
              [void][Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$null,
                [ref]$errors
              )
              foreach ($error in @($errors)) {
                $failed = $true
                Write-Host (
                  "::error file=$($_.FullName)," +
                  "line=$($error.Extent.StartLineNumber)::$($error.Message)"
                )
              }
            }
          if ($failed) {
            throw "One or more PowerShell scripts failed to parse."
          }

      - name: Reject deployment-specific values and sensitive files
        shell: pwsh
        run: ./solutions/entra-cba-playwright/scripts/Test-PublicTemplate.ps1

      - name: Validate the customer-shareable fresh proof
        working-directory: solutions/entra-cba-playwright
        run: node scripts/Test-CustomerProof.mjs

      - name: Test deployment experience guardrails
        shell: pwsh
        run: ./solutions/entra-cba-playwright/scripts/Test-DeploymentExperience.ps1

      - name: Install the pinned Bicep compiler
        shell: bash
        run: |
          set -euo pipefail
          az bicep install --version v0.41.2
          az bicep version | grep -F "0.41.2"

      - name: Compile the portal-safe Bicep deployment
        run: >
          az bicep build
          --file solutions/entra-cba-playwright/infra/portal.bicep
          --outfile "${RUNNER_TEMP}/entra-cba-portal.json"

      - name: Confirm the checked-in Deploy-to-Azure template matches the Bicep source
        shell: bash
        run: |
          set -euo pipefail
          checked_in="solutions/entra-cba-playwright/templates/azuredeploy/entra-cba-playwright-infrastructure.json"
          if ! diff -u "${RUNNER_TEMP}/entra-cba-portal.json" "$checked_in"; then
            echo "::error file=${checked_in}::The checked-in ARM template has drifted from infra/portal.bicep. Regenerate it with pinned Bicep v0.41.2 and commit the result."
            exit 1
          fi
